<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro de Receitas</title>
    <meta name="description"
        content="Pesquise receitas culinárias por nome e tipo e consulte ingredientes e modo de preparo.">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="icon" href="./assets/icon_142001.svg">
    <script type="module" src="scripts/home.js"></script>
</head>
<body>
    <header>
        <h1 class="page-title"><a href="index.html">Livro de Receitas</a></h1>
        <form id="search-form" class="search-form" role="search">
            <input type="search" name="text" maxlength="60" placeholder="Pesquisa sua receita" />

            <select id="select-category" name="category" class="select-category">
                <option value="">Categoria</option>
                <hr />
                <option value="doce">Doce</option>
                <option value="salgado">Salgado</option>
                <option value="agridoce">Agridoce</option>
            </select>

            <button type="submit">
                <img src="./assets/lu-search.svg" />
            </button>
        </form>
    </header>
    <div class="header-border"></div>

    <main>
        <div id="pagination" class="pagination" aria-label="Paginação dos resultados">
            <button id="prev-button" class="prev-button">
                <img src="./assets/arrow.png" />
            </button>

            <div id="page-info" class="page-info"></div>

            <button id="next-button" class="next-button">
                <img src="./assets/arrow.png" />
            </button>
        </div>

        <section id="results" class="recipe-list"></section>
    </main>

    <footer>
        <p>© 2026 Renan Santos e Jeiel</p>
    </footer>
</body>
</html>
